<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date | Keqing & Nicole</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #b7c9d9;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

.book {
  width: 420px;
  height: 720px;
  position: relative;
  perspective: 2500px;
  cursor: pointer;
}

.page {
  position: absolute;
  width: 100%;
  height: 100%;
  background: #b7c9d9;

  border: 1px solid rgba(255,255,255,0.35);

  box-shadow: 0 10px 40px rgba(0,0,0,0.15);

  display: flex;
  justify-content: center;
  align-items: center;

  transform-origin: left;
  transform-style: preserve-3d;

  transition: transform 1.2s ease;

  backface-visibility: hidden;

  overflow: hidden;

}

.page1 {
  z-index: 4;
}

.page2 {
  z-index: 3;
  transform: rotateY(-180deg);
}

.page3 {
  z-index: 2;
  transform: rotateY(-180deg);
}

.page4 {
  z-index: 1;
  transform: rotateY(-180deg);
}


.book.step1 .page1 {
  transform: rotateY(-180deg);
}

.book.step1 .page2 {
  transform: rotateY(0deg);
}

.book.step2 .page1 {
  transform: rotateY(-180deg);
}

.book.step2 .page2 {
  transform: rotateY(-180deg);
}

.book.step2 .page3 {
  transform: rotateY(0deg);
}

.book.step3 .page1 {
  transform: rotateY(-180deg);
}

.book.step3 .page2 {
  transform: rotateY(-180deg);
}

.book.step3 .page3 {
  transform: rotateY(-180deg);
}

.book.step3 .page4 {
  transform: rotateY(0deg);
}


.book.flipped .front {
  transform: rotateY(-180deg);
}

.book.flipped .back {
  transform: rotateY(0deg);
}

.inside-content {
  text-align: center;
  color: white;
  padding: 40px;
  font-family: 'Cormorant Garamond', serif;
}

.inside-content h1 {

  margin-bottom: 40px;

  font-family: 'Great Vibes', cursive;

  font-size: 58px;

  font-weight: 400;

  letter-spacing: 1px;

  color: white;

  opacity: 0.95;
}

.inside-content p {
  margin: 20px 0;
  line-height: 1.8;
  font-size: 22px;
}

  .card {
    width: 420px;
    max-width: 92%;
    height: 720px;
    background: #b7c9d9;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(255,255,255,0.18);
    pointer-events: none;
  }

  .the {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    opacity: 0.9;
    animation: fadeUp 1.8s ease forwards;
  }

  .date {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    font-weight: 300;
    margin-bottom: 80px;
    animation: fadeUp 2s ease forwards;
  }

  .names {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    font-size: 20px;
    letter-spacing: 1px;
    margin-bottom: 38px;
    animation: fadeUp 2.2s ease forwards;
    flex-wrap: nowrap;
    white-space: nowrap;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
  }

  .ampersand {
    font-family: 'Great Vibes', cursive;
    font-size: 30px;
    line-height: 1;
    margin-top: -6px;
    opacity: 0.95;
  }

  .details {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 40px;
    animation: fadeUp 2.5s ease forwards;
  }

  .detail-block {
    text-align: center;
  }

  .small {
    font-size: 18px;
    letter-spacing: 2px;
    opacity: 0.9;
  }

  .year {
  font-size: 28px;
}


  .big {
    font-size: 56px;
    font-weight: 600;
    line-height: 1;
    margin: 6px 0;
  }

  .divider {
    width: 1px;
    height: 72px;
    background: rgba(255,255,255,0.5);
  }

  .location {
    font-size: 24px;
    letter-spacing: 1px;
    opacity: 0.95;
    animation: fadeUp 2.8s ease forwards;
  }

  .footer {
    position: absolute;
    bottom: 28px;
    font-size: 15px;
    letter-spacing: 2px;
    opacity: 0.65;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 520px) {
    .card {
      height: 100vh;
      width: 100vw;
    }

    .save,
    .date {
      font-size: 48px;
    }

    .big {
      font-size: 46px;
    }

    .names {
      font-size: 20px;
      gap: 10px;
    }

    .ampersand {
      font-size: 40px;
    }

    .location {
      font-size: 20px;
    }
  }

  .venue-image {
  width: 100%;
  max-width: 280px;

  margin: 20px 0;

  border-radius: 12px;

  box-shadow: 0 6px 20px rgba(0,0,0,0.2);

  object-fit: cover;
}

/* 顶部花纹 */
.page::before {
  content: "";

  position: absolute;

  top: 0.5%;
  left: 0.5%;

  width: 100%;
  height: 200px;

  transform: scaleX(-1);

  background-image: url("pics/rose2.png");
  background-repeat: no-repeat;
  background-position: right center;
  background-size: contain;

  filter: brightness(0) invert(1);

  opacity: 0.75;

  pointer-events: none;

  z-index: 20;
}

/* 底部花纹 */
.page::after {
  content: "";

  position: absolute;

  bottom: 0.5%;
  right: 0.5%;

  width: 100%;
  height: 200px;

  transform: scaleY(-1);

  background-image: url("pics/rose2.png");
  background-repeat: no-repeat;
  background-position: right center;
  background-size: contain;

  filter: brightness(0) invert(1);

  opacity: 0.75;

  pointer-events: none;

  z-index: 20;
}

/* 右上角花纹 */
.top-right-ornament {

  position: absolute;

  top: 0.5%;
  right: 0.5%;

  width: 100%;
  height: 90px;

  background-image: url("pics/rose3.png");

  background-repeat: no-repeat;
  background-position: top right;
  background-size: contain;

  filter: brightness(0) invert(1);

  opacity: 0.72;

  pointer-events: none;

  z-index: 25;
}

.bottom-left-ornament {

  position: absolute;

  bottom: 0.5%;
  left: 0.5%;

  width: 100%;
  height: 90px;

  background-image: url("pics/rose3.png");

  background-repeat: no-repeat;
  background-position: top right;
  background-size: contain;

transform: rotate(180deg);

  filter: brightness(0) invert(1);

  opacity: 0.72;

  pointer-events: none;

  z-index: 25;
}


</style>
</head>



<body>

<div class="book" onclick="flipPage()">

  <!-- PAGE 1 -->
<div class="page page1" id="page1">

  <div class="top-right-ornament"></div>
  <div class="bottom-left-ornament"></div>


  <div class="inside-content">

    <div class="save"> </div>
    <div class="the">Wedding</div>
    <div class="date">Invitation</div>

    <div class="names">
      <span class="name">KEQING LIU</span>
      <span class="ampersand">&amp;</span>
      <span class="name">NICOLE ZHANG</span>
    </div>

    <div class="details">
      <div class="detail-block">
        <div class="small">AUGUST</div>
      </div>

      <div class="divider"></div>

      <div class="detail-block">
        <div class="big">17</div>
      </div>

      <div class="divider"></div>

      <div class="detail-block">
        <div class="small year">2026</div>
      </div>
    </div>

    <div class="location">
      Stanley Park, Vancouver
    </div>

  </div>
</div>


  <!-- PAGE 2 -->
  <div class="page page2" id="page2">

      <div class="top-right-ornament"></div>
  <div class="bottom-left-ornament"></div>


    <div class="inside-content">
      <h1>Ceremony</h1>

      <p>
        Time<br>
       16:00 - 17:00
      </p>

      <img src="pics/outside_v2.jpg" class="venue-image">


      <p>
        Venue<br>
        Conservatory Green
      </p>

    </div>

  </div>


  <!-- PAGE 3 -->
  <div class="page page3" id="page3">

      <div class="top-right-ornament"></div>
  <div class="bottom-left-ornament"></div>


    <div class="inside-content">

      <h1>Dinner </h1>

      <p>
        Time<br>
       17:30 - 20:00
      </p>

            <img src="pics/drawingRoom_v2.jpg" class="venue-image">

      <p>
        Venue<br>
        Drawing Room
      </p>

    </div>

  </div>

  <!-- PAGE 4 -->
<div class="page page4" id="page4">

  <div class="top-right-ornament"></div>
  <div class="bottom-left-ornament"></div>


  <div class="inside-content">

         <h1>Location</h1>
    <p>
      the Teahouse in Stanley Park
    </p>

      <p style="margin-top:10px;font-size:17px;">
        7501 Stanley Park Dr, Vancouver
      </p>

        <img src="pics/maps_v2.jpg" class="venue-image">





  </div>

</div>

</div>



<script>

let step = 0;

function flipPage() {

  const book = document.querySelector('.book');

  step++;

  if(step === 1) {
    book.classList.add('step1');
  }

  else if(step === 2) {
    book.classList.add('step2');
  }

  else if(step === 3) {
    book.classList.add('step3');
  }

  else {

    book.classList.remove('step1');
    book.classList.remove('step2');
    book.classList.remove('step3');

    step = 0;
  }

}

</script>

</body>
</html>
